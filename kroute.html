<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>K-ROUTE — K-POP 팬 여행 패스포트</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Caveat:wght@400;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%;width:100%;background:#111;font-family:'Nunito',sans-serif;color:#111;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:'Nunito',sans-serif;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:'Nunito',sans-serif}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:#ddd;border-radius:2px}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{0%{transform:scale(0) rotate(-12deg);opacity:0}65%{transform:scale(1.15) rotate(4deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes stampIn{0%{transform:scale(3.5) rotate(-20deg);opacity:0}55%{transform:scale(.88) rotate(5deg);opacity:1}75%{transform:scale(1.06) rotate(-2deg)}100%{transform:scale(1) rotate(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes confetti{0%{transform:translateY(0) rotate(0) scale(1);opacity:1}100%{transform:translateY(110vh) rotate(720deg) scale(.4);opacity:0}}
@keyframes bounceIn{0%{transform:scale(.3);opacity:0}50%{transform:scale(1.08)}70%{transform:scale(.94)}100%{transform:scale(1);opacity:1}}
.aFadeUp{animation:fadeUp .5s ease forwards}
.aFadeIn{animation:fadeIn .4s ease forwards}
.aStampIn{animation:stampIn .7s cubic-bezier(.34,1.2,.64,1) forwards}
.aFloat{animation:float 3s ease-in-out infinite}
.aSpin{animation:spin 1.5s linear infinite}
.aSlideUp{animation:slideUp .4s cubic-bezier(.32,.72,0,1) forwards}
.aBounceIn{animation:bounceIn .6s cubic-bezier(.34,1.4,.64,1) forwards}
.aD1{animation-delay:.1s}.aD2{animation-delay:.2s}.aD3{animation-delay:.3s}
.aD4{animation-delay:.4s}.aD5{animation-delay:.5s}.hidden0{opacity:0}
.scroll-y{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect} = React;

/* ─── TOKENS ─── */
const CREAM='#FAF6EF',PINK='#FF3399',LIME='#AAFF00',YELLOW='#FFE566',CYAN='#00D4D4';
const BLACK='#111111',LBLUE='#D6EEFF',PALGREEN='#E8FFD6',WHITE='#FFFFFF';
const SHADOW='4px 4px 0 '+BLACK, BSHADOW='3px 3px 0 '+BLACK, BORDER='2.5px solid '+BLACK;

/* ─── DATA ─── */
const ARTISTS=[
  {id:'bts',name:'BTS',initials:'BT',circleColor:'#C4B5FD'},
  {id:'blackpink',name:'BLACKPINK',initials:'BP',circleColor:'#FBCFE8'},
  {id:'aespa',name:'aespa',initials:'AE',circleColor:'#BAE6FD'},
  {id:'newjeans',name:'NewJeans',initials:'NJ',circleColor:'#BBF7D0'},
  {id:'straykids',name:'Stray Kids',initials:'SK',circleColor:'#FED7AA'},
  {id:'ive',name:'IVE',initials:'IV',circleColor:'#FECACA'},
  {id:'nct',name:'NCT',initials:'NC',circleColor:'#99F6E4'},
  {id:'twice',name:'TWICE',initials:'TW',circleColor:'#FDE68A'},
];

const REGIONS=[
  {id:'seoul',name:'Seoul',artistId:'bts',x:55,y:28,cities:['Gangnam-gu','Yongsan-gu','Mapo-gu'],
    photo:'photo-1538485399081-7191377e8241',desc:'vibrant capital city'},
  {id:'jeonju',name:'Jeonju',artistId:'ive',x:33,y:60,cities:['Wansan-gu','Deokjin-gu'],
    photo:'photo-1519817914152-22d216bb9170',desc:'historic hanok village capital'},
  {id:'gyeongju',name:'Gyeongju',artistId:'nct',x:72,y:60,cities:['Gyeongju-si'],
    photo:'photo-1597466765535-d5ee1e3f80b4',desc:'ancient Silla Kingdom heritage'},
  {id:'busan',name:'Busan',artistId:'blackpink',x:76,y:73,cities:['Haeundae-gu','Suyeong-gu'],
    photo:'photo-1583579011440-bd09a0dd9fd0',desc:'coastal second city'},
  {id:'jeju',name:'Jeju',artistId:'twice',x:36,y:90,cities:['Jeju-si','Seogwipo-si'],
    photo:'photo-1546417971-347f6fa2b77d',desc:'beautiful island paradise'},
];

const getMissions=(city)=>[
  {id:'m1',name:city+' Photo Spot',desc:'Take a photo at the famous K-drama filming location loved by your favorite artists!',stamp:'📸',location:city+' Central'},
  {id:'m2',name:city+' Café Tour',desc:'Order the artist signature drink at this iconic café featured in K-content.',stamp:'☕',location:city+' Café District'},
  {id:'m3',name:city+' Merch Hunt',desc:'Find and collect exclusive limited-edition merchandise from the official K-pop shop.',stamp:'🎁',location:city+' Shopping Street'},
];


/* ─── SHARED COMPONENTS ─── */
function Pill({children,bg,color,style={}}){
  return(
    <span style={{display:'inline-flex',alignItems:'center',gap:3,padding:'4px 12px',
      borderRadius:50,border:BORDER,background:bg||LIME,color:color||BLACK,
      fontFamily:'Outfit',fontWeight:700,fontSize:12,whiteSpace:'nowrap',...style}}>
      {children}
    </span>
  );
}

function KBtn({children,onClick,bg,color,outline,disabled,style={}}){
  const bgC=outline?'transparent':(bg||PINK);
  const col=color||(outline?BLACK:WHITE);
  const [pressed,setPressed]=useState(false);
  return(
    <button onClick={disabled?undefined:onClick}
      onMouseDown={()=>{if(!disabled)setPressed(true)}}
      onMouseUp={()=>setPressed(false)}
      onMouseLeave={()=>setPressed(false)}
      onTouchStart={()=>{if(!disabled)setPressed(true)}}
      onTouchEnd={()=>setPressed(false)}
      style={{width:'100%',padding:'16px',borderRadius:50,border:BORDER,
        fontFamily:'Outfit',fontWeight:900,fontSize:16,letterSpacing:'.5px',
        cursor:disabled?'not-allowed':'pointer',
        background:bgC,color:col,
        boxShadow:disabled?'none':pressed?'1px 1px 0 '+BLACK:BSHADOW,
        transform:pressed?'translate(2px,2px)':'none',
        opacity:disabled?.5:1,transition:'transform .08s,box-shadow .08s',...style}}>
      {children}
    </button>
  );
}

function KCard({children,style={},className=''}){
  return(
    <div className={className}
      style={{background:WHITE,border:BORDER,borderRadius:16,boxShadow:SHADOW,...style}}>
      {children}
    </div>
  );
}

function BackBtn({onClick}){
  return(
    <button onClick={onClick}
      style={{width:40,height:40,borderRadius:10,border:BORDER,background:WHITE,
        boxShadow:BSHADOW,display:'flex',alignItems:'center',justifyContent:'center',fontSize:18,flexShrink:0}}>
      ←
    </button>
  );
}

function BottomNav({active,onChange}){
  const tabs=[
    {id:'cover',label:'Cover',icon:'🏠'},
    {id:'route',label:'Route',icon:'🗺️'},
    {id:'stamps',label:'Stamps',icon:'🏅'},
    {id:'diary',label:'Diary',icon:'📖'},
  ];
  return(
    <div style={{display:'flex',borderTop:BORDER,background:WHITE,flexShrink:0}}>
      {tabs.map(t=>(
        <button key={t.id} onClick={()=>onChange(t.id)}
          style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',
            padding:'10px 0',gap:3,background:'none',border:'none',cursor:'pointer'}}>
          <div style={{width:44,height:44,borderRadius:50,display:'flex',alignItems:'center',
            justifyContent:'center',fontSize:20,
            background:active===t.id?PINK:'transparent',
            border:active===t.id?BORDER:'2.5px solid transparent',
            boxShadow:active===t.id?BSHADOW:'none',transition:'all .15s'}}>
            {t.icon}
          </div>
          <span style={{fontSize:11,fontWeight:700,fontFamily:'Outfit',
            color:active===t.id?PINK:BLACK}}>
            {t.label}
          </span>
        </button>
      ))}
    </div>
  );
}

/* ─── SHELL (module-level so component reference is stable) ─── */
function Shell({children,overlay}){
  return(
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',
      height:'100vh',width:'100vw',background:'#111'}}>
      <div style={{width:'100%',maxWidth:430,height:'100%',maxHeight:900,
        position:'relative',overflow:'hidden',
        boxShadow:'0 0 60px rgba(0,0,0,.8)'}}>
        {children}
        {overlay}
      </div>
    </div>
  );
}

/* ════════════════════════════════════════
   SCREENS
════════════════════════════════════════ */

function LoadingScreen({onDone}){
  useEffect(()=>{const t=setTimeout(onDone,2600);return()=>clearTimeout(t)},[]);
  return(
    <div style={{height:'100%',background:PINK,display:'flex',flexDirection:'column',
      alignItems:'center',justifyContent:'center',padding:32,position:'relative',overflow:'hidden'}}>
      <div style={{position:'absolute',top:-80,right:-80,width:240,height:240,borderRadius:'50%',border:'3px solid rgba(0,0,0,.12)'}}/>
      <div style={{position:'absolute',bottom:-60,left:-60,width:200,height:200,borderRadius:'50%',border:'3px solid rgba(0,0,0,.12)'}}/>
      <div style={{position:'absolute',top:'18%',left:'-8%',width:130,height:130,borderRadius:'50%',border:'2px solid rgba(255,255,255,.2)'}}/>

      {/* K-TRAVEL PASSPORT pill at top */}
      <div className="aFadeUp hidden0" style={{position:'absolute',top:60,left:'50%',transform:'translateX(-50%)'}}>
        <Pill bg={LIME} style={{fontSize:12,padding:'5px 16px',letterSpacing:.5}}>K-TRAVEL PASSPORT</Pill>
      </div>

      {/* Sparkles + Title */}
      <div className="aFadeUp" style={{marginBottom:4,position:'relative'}}>
        <div style={{position:'absolute',top:-20,left:-28,fontSize:22,color:CYAN}}>✦</div>
        <div style={{position:'absolute',top:-8,right:-24,fontSize:14,color:YELLOW}}>✦</div>
        <div style={{position:'absolute',bottom:-10,right:-16,fontSize:18,color:CYAN}}>✦</div>
        <h1 style={{fontFamily:'Outfit',fontWeight:900,fontSize:78,lineHeight:1,
          color:BLACK,letterSpacing:'-3px',textAlign:'center'}}>
          ✦K-ROUTE
        </h1>
      </div>
      <div className="aFadeUp aD2 hidden0" style={{marginTop:4}}>
        <p style={{fontFamily:'Caveat',fontWeight:700,fontSize:24,color:CYAN,
          fontStyle:'italic',textAlign:'center'}}>
          {'your K-culture guide! ✦'}
        </p>
      </div>

      {/* Illustrated card */}
      <div className="aFadeUp aD3 hidden0" style={{marginTop:28,width:'100%',maxWidth:270}}>
        <div style={{background:'#FFF9E6',border:BORDER,borderRadius:20,boxShadow:SHADOW,
          padding:20,textAlign:'center',position:'relative'}}>
          {/* Decorative stamps in corners */}
          <div style={{position:'absolute',top:10,left:14,fontSize:18,opacity:.5}}>☕</div>
          <div style={{position:'absolute',top:10,right:14,fontSize:18,opacity:.5}}>📸</div>
          <div style={{fontSize:60}} className="aFloat">🗺️</div>
          <p style={{fontFamily:'Outfit',fontWeight:900,fontSize:15,marginTop:8,color:BLACK}}>
            KOREA ADVENTURE
          </p>
          <p style={{fontFamily:'Caveat',fontSize:15,color:'#888',fontStyle:'italic',marginTop:2}}>
            Collect stamps · Build routes
          </p>
        </div>
      </div>

      <div className="aFadeUp aD4 hidden0" style={{marginTop:24,width:'100%',maxWidth:280}}>
        <KBtn bg={CYAN} color={BLACK} onClick={onDone}>START EXPEDITION 🚀</KBtn>
      </div>
      <p className="aFadeUp aD5 hidden0"
        style={{marginTop:14,fontFamily:'Nunito',fontSize:12,color:'rgba(255,255,255,.7)',fontWeight:600}}>
        v1.0.0 · Made with K-Love 💕
      </p>
    </div>
  );
}

function SignInScreen({onNext}){
  const [email,setEmail]=useState('');
  return(
    <div style={{height:'100%',background:CREAM,display:'flex',flexDirection:'column',
      padding:'0 24px',overflowY:'auto'}}>
      <div style={{alignSelf:'center',marginTop:52,marginBottom:20}}>
        {/* X logo circle — matches STARA wireframe */}
        <div style={{width:64,height:64,borderRadius:'50%',background:WHITE,border:BORDER,
          boxShadow:SHADOW,display:'flex',alignItems:'center',justifyContent:'center'}}>
          <div style={{width:46,height:46,borderRadius:'50%',border:'2.5px solid '+PINK,
            display:'flex',alignItems:'center',justifyContent:'center'}}>
            <span style={{fontFamily:'Outfit',fontWeight:900,fontSize:22,color:PINK}}>✕</span>
          </div>
        </div>
      </div>
      <h1 style={{fontFamily:'Outfit',fontWeight:900,fontSize:28,textAlign:'center'}}>
        Welcome to K-ROUTE
      </h1>
      <div style={{marginTop:10,textAlign:'center'}}>
        <Pill bg='#E8FFF4' style={{fontSize:12,border:'2px solid #B2EDD4'}}>
          YOUR K-TRAVEL PASSPORT ✨
        </Pill>
      </div>
      <div style={{marginTop:28,display:'flex',flexDirection:'column',gap:12}}>
        {['🔍  Continue with Google','🍎  Continue with Apple'].map(s=>(
          <button key={s} onClick={onNext}
            style={{display:'flex',alignItems:'center',justifyContent:'center',gap:8,
              padding:'14px 20px',borderRadius:50,border:BORDER,background:WHITE,
              fontFamily:'Outfit',fontWeight:700,fontSize:15,cursor:'pointer',
              boxShadow:BSHADOW}}>
            {s}
          </button>
        ))}
        <div style={{display:'flex',alignItems:'center',gap:10,margin:'4px 0'}}>
          <div style={{flex:1,height:2,background:'#E5E0D8'}}/>
          <span style={{fontFamily:'Nunito',fontSize:13,color:'#999',fontWeight:600}}>or</span>
          <div style={{flex:1,height:2,background:'#E5E0D8'}}/>
        </div>
        <input value={email} onChange={e=>setEmail(e.target.value)}
          placeholder="your@email.com"
          style={{width:'100%',padding:'14px 20px',borderRadius:50,border:BORDER,
            background:WHITE,fontSize:15,fontWeight:600,outline:'none',boxShadow:BSHADOW}}/>
        <KBtn onClick={onNext}>CONTINUE WITH EMAIL →</KBtn>
      </div>
      <p style={{textAlign:'center',fontSize:12,color:'#aaa',margin:'16px 0 32px',fontWeight:500}}>
        By continuing, you agree to our Terms of Service
      </p>
    </div>
  );
}

function ArtistSelectScreen({onNext}){
  const [sel,setSel]=useState(null);
  return(
    <div style={{height:'100%',background:CREAM,display:'flex',flexDirection:'column'}}>
      <div style={{padding:'48px 24px 12px'}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
          <span style={{fontFamily:'Outfit',fontWeight:900,fontSize:13,letterSpacing:1,color:'#888'}}>
            PICK YOUR BIAS
          </span>
          <div style={{width:38,height:38,borderRadius:10,border:BORDER,background:WHITE,
            boxShadow:BSHADOW,display:'flex',alignItems:'center',justifyContent:'center',fontSize:16}}>
            ☰
          </div>
        </div>
        <h2 style={{fontFamily:'Outfit',fontWeight:900,fontSize:26,lineHeight:1.2}}>
          Select your travel mate!
        </h2>
        <p style={{fontFamily:'Nunito',fontSize:13,color:'#666',marginTop:6,lineHeight:1.5}}>
          Choose an artist to customize your curated stamps and route experiences.
        </p>
      </div>
      <div className="scroll-y" style={{flex:1,padding:'0 24px'}}>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:12,paddingBottom:8}}>
          {ARTISTS.map(a=>{
            const isSel=sel===a.id;
            return(
              <button key={a.id} onClick={()=>setSel(a.id)} className="aFadeUp"
                style={{display:'flex',flexDirection:'column',alignItems:'center',gap:6,
                  padding:'12px 8px',borderRadius:16,
                  border:isSel?'2.5px solid '+PINK:BORDER,
                  background:WHITE,cursor:'pointer',position:'relative',
                  boxShadow:isSel?'4px 4px 0 '+PINK:SHADOW}}>
                <div style={{width:54,height:54,borderRadius:12,background:a.circleColor,
                  border:BORDER,display:'flex',alignItems:'center',justifyContent:'center',
                  fontFamily:'Outfit',fontWeight:900,fontSize:16,color:BLACK}}>
                  {a.initials}
                </div>
                <span style={{fontFamily:'Outfit',fontWeight:700,fontSize:11,
                  color:BLACK,textAlign:'center',lineHeight:1.2}}>
                  {a.name}
                </span>
                {isSel&&(
                  <div style={{position:'absolute',bottom:-10,left:'50%',transform:'translateX(-50%)',
                    background:PINK,borderRadius:50,border:BORDER,padding:'2px 10px',
                    fontFamily:'Outfit',fontWeight:900,fontSize:10,color:WHITE,
                    whiteSpace:'nowrap',boxShadow:'2px 2px 0 '+BLACK,zIndex:1}}>
                    BIAS ✦
                  </div>
                )}
              </button>
            );
          })}
        </div>
      </div>
      <div style={{padding:'20px 24px 32px'}}>
        <KBtn bg={LIME} color={BLACK} disabled={!sel} onClick={()=>onNext(sel)}>
          CONTINUE TO REGION MAP →
        </KBtn>
      </div>
    </div>
  );
}

function MapScreen({onSelectRegion,activeTab,onTabChange}){
  const [hov,setHov]=useState(null);
  const pillBg={seoul:PINK,jeonju:YELLOW,gyeongju:WHITE,busan:CYAN,jeju:LIME};
  return(
    <div style={{height:'100%',background:CREAM,display:'flex',flexDirection:'column'}}>
      <div style={{padding:'48px 24px 12px'}}>
        <span style={{fontFamily:'Outfit',fontWeight:900,fontSize:12,letterSpacing:1,color:'#888'}}>
          CHOOSE REGION
        </span>
        <h2 style={{fontFamily:'Outfit',fontWeight:900,fontSize:24,marginTop:4}}>
          Where are we headed? 🗺️
        </h2>
        <p style={{fontFamily:'Nunito',fontSize:13,color:'#666',marginTop:4,lineHeight:1.5}}>
          Each region is filled with unique cultural missions & K-content pop-ups.
        </p>
      </div>

      {/* Korea map */}
      <div style={{flex:1,position:'relative',overflow:'hidden',margin:'0 20px 8px',
        borderRadius:20,border:BORDER,background:LBLUE}}>
        <svg style={{width:'100%',height:'100%',display:'block'}} viewBox="0 0 300 400" preserveAspectRatio="xMidYMid meet">
          <rect width="300" height="400" fill={LBLUE}/>
          {/* Korea mainland */}
          <path d="M122,56 C133,50 152,48 170,53 C186,58 201,71 211,92 C219,109 221,130 218,152 C215,172 208,188 214,208 C220,228 218,246 209,262 C200,278 185,289 168,295 C154,300 139,299 125,293 C111,287 99,274 91,257 C83,240 80,220 81,200 C82,180 89,162 89,142 C89,122 96,102 107,84 C115,70 117,64 122,56 Z"
            fill="#B8CEB8" stroke={BLACK} strokeWidth="1.5" strokeLinejoin="round"/>
          {/* Jeju island */}
          <ellipse cx="110" cy="354" rx="33" ry="18" fill="#B8CEB8" stroke={BLACK} strokeWidth="1.5"/>
        </svg>
        {/* Overlaid region pills */}
        {REGIONS.map(r=>{
          const bg=pillBg[r.id]||WHITE;
          const isH=hov===r.id;
          return(
            <button key={r.id}
              onClick={()=>onSelectRegion(r)}
              onMouseEnter={()=>setHov(r.id)}
              onMouseLeave={()=>setHov(null)}
              style={{position:'absolute',left:r.x+'%',top:r.y+'%',
                transform:'translate(-50%,-50%)',
                display:'flex',alignItems:'center',gap:5,
                padding:'6px 12px 6px 8px',borderRadius:50,border:BORDER,background:bg,
                fontFamily:'Outfit',fontWeight:700,fontSize:12,color:BLACK,
                cursor:'pointer',whiteSpace:'nowrap',zIndex:10,
                boxShadow:isH?SHADOW:BSHADOW,transition:'box-shadow .15s'}}>
              <span style={{width:8,height:8,borderRadius:'50%',display:'inline-block',flexShrink:0,
                background:r.id==='seoul'?WHITE:r.id==='jeju'?BLACK:BLACK,border:'1.5px solid '+BLACK}}/>
              {r.name}
              {r.id==='seoul'&&<span style={{fontSize:9}}>✦</span>}
            </button>
          );
        })}
      </div>

      <BottomNav active={activeTab||'route'} onChange={onTabChange}/>
    </div>
  );
}

function RegionDetailScreen({region,onSelect,onBack}){
  const artist=ARTISTS.find(a=>a.id===region.artistId);
  return(
    <div style={{height:'100%',background:CREAM,display:'flex',flexDirection:'column'}}>
      {/* Photo header */}
      <div style={{height:210,position:'relative',flexShrink:0,overflow:'hidden'}}>
        <img src={'https://images.unsplash.com/'+region.photo+'?w=430&h=210&fit=crop&auto=format'}
          alt={region.name} style={{width:'100%',height:'100%',objectFit:'cover'}}/>
        <div style={{position:'absolute',inset:0,
          background:'linear-gradient(to bottom,rgba(0,0,0,.18),rgba(0,0,0,.55))'}}/>
        <div style={{position:'absolute',top:16,left:16}}>
          <BackBtn onClick={onBack}/>
        </div>
        <div style={{position:'absolute',bottom:14,left:16}}>
          <h2 style={{fontFamily:'Outfit',fontWeight:900,fontSize:26,color:WHITE,
            textShadow:'2px 2px 0 rgba(0,0,0,.4)'}}>
            {region.name}, Korea
          </h2>
        </div>
        <div style={{position:'absolute',bottom:16,right:16}}>
          <Pill bg={YELLOW} style={{fontSize:12}}>🏅 6 STAMPS</Pill>
        </div>
      </div>

      <div className="scroll-y" style={{flex:1,padding:'16px 24px'}}>
        <p style={{fontFamily:'Nunito',fontSize:14,color:'#666',marginBottom:14,lineHeight:1.6}}>
          {"Korea's "+region.desc+" — discover K-drama filming spots, cafés, and hidden gems."}
        </p>

        {/* Quest card */}
        <KCard style={{padding:16,marginBottom:14}}>

function RouteGeneratingScreen({city,onDone}){
  const [prog,setProg]=useState(0);
  const steps=['Analyzing K-drama spots...','Calculating optimal path...','Setting mission points...','Finalizing your route! 🎉'];
  const step=Math.min(Math.floor(prog/26),steps.length-1);
  useEffect(()=>{
    const iv=setInterval(()=>{
      setProg(p=>{
        if(p>=100){clearInterval(iv);setTimeout(onDone,600);return 100;}
        return p+1.6;
      });
    },50);
    return()=>clearInterval(iv);
  },[]);
  return(
    <div style={{height:'100%',display:'flex',flexDirection:'column',alignItems:'center',
      justifyContent:'center',padding:32,
      background:'linear-gradient(135deg,#FFF0E6 0%,#E8FFD6 50%,'+LBLUE+' 100%)'}}>
      {/* Dashed spinner */}
      <div style={{position:'relative',marginBottom:28}}>
        <div style={{width:100,height:100,borderRadius:'50%',border:'3px dashed '+BLACK,
          display:'flex',alignItems:'center',justifyContent:'center',
          animation:'spin 4s linear infinite'}}>
          <div style={{width:80,height:80,borderRadius:'50%',background:WHITE,border:BORDER,
            boxShadow:SHADOW,display:'flex',alignItems:'center',justifyContent:'center',fontSize:40}}>
            ✈️
          </div>
        </div>
      </div>
      <Pill bg={YELLOW} style={{fontSize:13,padding:'6px 18px',marginBottom:20}}>
        NATURAL COURSE · OPTIMAL PATH
      </Pill>
      <h2 style={{fontFamily:'Outfit',fontWeight:900,fontSize:24,textAlign:'center',marginBottom:4}}>
        Generating Route
      </h2>
      <p style={{fontFamily:'Caveat',fontSize:18,color:'#666',textAlign:'center',fontStyle:'italic',marginBottom:28}}>
        {'Creating your '+city+' experience...'}
      </p>
      <div style={{width:'100%',maxWidth:320,display:'flex',flexDirection:'column',gap:8}}>
        {steps.map((s,i)=>(
          <div key={s} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 14px',
            borderRadius:12,border:BORDER,
            background:i<=step?PALGREEN:WHITE,
            boxShadow:i<=step?SHADOW:'none',opacity:i>step+1?.4:1,transition:'all .3s'}}>
            <div style={{width:22,height:22,borderRadius:'50%',flexShrink:0,
              background:i<step?LIME:i===step?YELLOW:'#eee',border:BORDER,
              display:'flex',alignItems:'center',justifyContent:'center',
              fontFamily:'Outfit',fontWeight:900,fontSize:11}}>
              {i<step?'✓':i===step?'●':(i+1)}
            </div>
            <span style={{fontFamily:'Nunito',fontWeight:700,fontSize:13,color:i<=step?BLACK:'#999'}}>{s}</span>
          </div>
        ))}
      </div>
      <div style={{width:'100%',maxWidth:320,marginTop:20}}>
        <div style={{height:8,borderRadius:50,border:BORDER,overflow:'hidden',background:'#eee'}}>
          <div style={{height:'100%',background:PINK,borderRadius:50,width:prog+'%',transition:'width .1s'}}/>
        </div>
        <p style={{textAlign:'center',fontSize:12,color:'#888',marginTop:6,fontWeight:700}}>
          {Math.round(prog)}%
        </p>
      </div>
    </div>
  );
}

function MissionSuccessOverlay({mission,missionIdx,totalMissions,onContinue}){
  const [show,setShow]=useState(false);
  useEffect(()=>{const t=setTimeout(()=>setShow(true),300);return()=>clearTimeout(t)},[]);
  const isLast=missionIdx>=totalMissions-1;
  const confettiItems=[...Array(16)].map((_,i)=>({
    left:Math.round(i*6+2),
    dur:Math.round((1.4+i*.1)*10)/10,
    delay:Math.round(i*.032*10)/10,
    color:[PINK,LIME,YELLOW,CYAN][i%4],
    rot:i*22,
  }));
  return(
    <div style={{position:'absolute',inset:0,zIndex:60,
      background:'rgba(0,0,0,.72)',display:'flex',alignItems:'center',
      justifyContent:'center',padding:24}}>
      {show&&confettiItems.map((c,i)=>(
        <div key={i} style={{position:'absolute',width:10,height:14,borderRadius:3,
          left:c.left+'%',top:'-20px',background:c.color,
          animation:'confetti '+c.dur+'s ease-in '+c.delay+'s both',
          transform:'rotate('+c.rot+'deg)'}}/>
      ))}
      <KCard className="aBounceIn" style={{width:'100%',maxWidth:320,padding:28,textAlign:'center'}}>
        <div style={{width:80,height:80,borderRadius:'50%',background:YELLOW,border:BORDER,

          CONGRATULATIONS!

        <p style={{fontFamily:'Caveat',fontSize:22,fontStyle:'italic',color:'#555',marginBottom:8}}>

        <div className={show?'aStampIn':''} style={{width:72,height:72,borderRadius:16,border:BORDER,

        ))}
      </div>
      <BottomNav active={activeTab||'diary'} onChange={onTabChange}/>
    </div>
  );
}

function DiaryPromptScreen({city,onView,onSkip}){
  return(
    <div style={{height:'100%',background:CREAM,display:'flex',flexDirection:'column',
      alignItems:'center',justifyContent:'center',padding:28}}>
      <Pill bg={YELLOW} style={{fontSize:13,padding:'6px 18px',marginBottom:20}}>
        MEMORIES SAVED! 📸
      </Pill>
      <h1 style={{fontFamily:'Outfit',fontWeight:900,fontSize:25,textAlign:'center',
        marginBottom:8,letterSpacing:'-.5px'}}>
        YOUR TRIP DIARY IS READY
      </h1>
      <p style={{fontFamily:'Caveat',fontSize:20,color:'#888',fontStyle:'italic',
        textAlign:'center',marginBottom:28}}>
        {city+' adventure is saved ✨'}
      </p>
      <KCard style={{width:'100%',maxWidth:340,padding:16,marginBottom:24}}>
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <div style={{width:52,height:52,borderRadius:12,background:LBLUE,border:BORDER,
            display:'flex',alignItems:'center',justifyContent:'center',fontSize:24,flexShrink:0}}>
            📖
          </div>
          <div style={{flex:1}}>
            <p style={{fontFamily:'Outfit',fontWeight:900,fontSize:14}}>{city+' Trip'}</p>
            <p style={{fontFamily:'Nunito',fontSize:12,color:'#888'}}>3 missions · Today</p>
          </div>
          <Pill bg={LIME} style={{fontSize:10}}>NEW!</Pill>
        </div>
      </KCard>
      <div style={{width:'100%',maxWidth:340,display:'flex',flexDirection:'column',gap:10}}>
        <KBtn bg='#22c55e' color={WHITE} onClick={onView}>VIEW DIARY 📖</KBtn>
        <KBtn outline onClick={onSkip}>SKIP FOR NOW</KBtn>
      </div>
    </div>
  );
}

/* ════════════════════════════════════════
   APP
════════════════════════════════════════ */
function App(){
  const [screen,setScreen]=useState('loading');
  const [selArtist,setSelArtist]=useState(null);
  const [selRegion,setSelRegion]=useState(null);
  const [selCity,setSelCity]=useState('');
  const [missions,setMissions]=useState([]);
  const [activeMissionIdx,setActiveMissionIdx]=useState(null);
  const [completedMissions,setCompletedMissions]=useState(0);
  const [showMissionDetail,setShowMissionDetail]=useState(false);
  const [showMissionSuccess,setShowMissionSuccess]=useState(false);
  const [activeTab,setActiveTab]=useState('cover');
  const [completedCities,setCompletedCities]=useState([]);

  const go=s=>setScreen(s);

  const handleTabChange=tab=>{
    setActiveTab(tab);
    if(tab==='route'){
      if(selRegion&&missions.length>0)go('mission-map');
      else go('map');
    }else if(tab==='cover'){
      if(selRegion)go('home');else go('signin');
    }else if(tab==='stamps'){
      go('stamps');
    }else if(tab==='diary'){
      go('diary');
    }
  };

  const handleMissionSuccess=()=>{
    setShowMissionDetail(false);
    setShowMissionSuccess(true);
  };

  const handleSuccessContinue=()=>{
    setShowMissionSuccess(false);
    const next=completedMissions+1;
    setCompletedMissions(next);
    if(next>=missions.length){
      go('route-complete');
    }
  };

  const handleCollectStamp=()=>{
    if(selCity)setCompletedCities(cs=>[...cs,selCity]);
    go('diary-prompt');
  };

  // Build overlay
  let overlay=null;
  if(showMissionSuccess&&activeMissionIdx!==null&&missions[activeMissionIdx]){
    overlay=(
      <MissionSuccessOverlay
        mission={missions[activeMissionIdx]}
        missionIdx={activeMissionIdx}
        totalMissions={missions.length}
        onContinue={handleSuccessContinue}
      />
    );
  }else if(showMissionDetail&&activeMissionIdx!==null&&missions[activeMissionIdx]){
    overlay=(
      <MissionDetailSheet
        mission={missions[activeMissionIdx]}
        onSuccess={handleMissionSuccess}
        onClose={()=>{setShowMissionDetail(false);setActiveMissionIdx(null)}}
      />
    );
  }

  // Current screen content
  let content=null;
  if(screen==='loading'){
    content=<LoadingScreen onDone={()=>go('signin')}/>;
  }else if(screen==='signin'){
    content=<SignInScreen onNext={()=>go('artist-select')}/>;
  }else if(screen==='artist-select'){
    content=<ArtistSelectScreen onNext={id=>{setSelArtist(id);go('map')}}/>;
  }else if(screen==='map'){
    content=(
      <MapScreen
        onSelectRegion={r=>{setSelRegion(r);go('region-detail')}}
        activeTab={activeTab}
        onTabChange={handleTabChange}
      />
    );
  }else if(screen==='region-detail'&&selRegion){
    content=(
      <RegionDetailScreen
        region={selRegion}
        onSelect={city=>{setSelCity(city);go('city-confirm')}}
        onBack={()=>go('map')}
      />
    );
  }else if(screen==='city-confirm'&&selRegion){
    content=(
      <CityConfirmScreen
        region={selRegion}
        city={selCity}
        onConfirm={()=>go('route-generating')}
        onCancel={()=>go('region-detail')}
      />
    );
  }else if(screen==='route-generating'){
    content=(
      <RouteGeneratingScreen
        city={selCity}
        onDone={()=>{setMissions(getMissions(selCity));setCompletedMissions(0);go('route-preview')}}
      />
    );
  }else if(screen==='route-preview'){
    content=(
      <RoutePreviewScreen
        city={selCity}
        missions={missions}
        onConfirm={()=>go('route-confirm')}
        onTabChange={handleTabChange}
      />
    );
  }else if(screen==='route-confirm'){
    content=<RouteConfirmScreen onYes={()=>go('travel-start')} onNo={()=>go('custom-map')}/>;
  }else if(screen==='travel-start'){
    content=(
      <TravelStartScreen
        city={selCity}
        onEnter={()=>{setActiveTab('cover');go('home')}}
      />
    );
  }else if(screen==='home'){
    content=(
      <HomeCoverScreen
        region={selRegion}
        city={selCity}
        completedMissions={completedMissions}
        totalMissions={missions.length}
        onContinueMission={()=>{setActiveTab('route');go('mission-map')}}
        onTabChange={handleTabChange}
      />
    );
  }else if(screen==='mission-map'&&selRegion){
    content=(
      <MissionMapScreen
        city={selCity}
        missions={missions}
        completedIdx={completedMissions}
        onMissionTap={idx=>{setActiveMissionIdx(idx);setShowMissionDetail(true)}}
        activeTab={activeTab}
        onTabChange={handleTabChange}
      />
    );
  }else if(screen==='route-complete'){
    content=<RouteCompleteScreen city={selCity} onCollect={handleCollectStamp}/>;
  }else if(screen==='custom-map'){
    content=(
      <CustomMapScreen
        city={selCity}
        onGenerate={()=>{setMissions(getMissions(selCity));setCompletedMissions(0);go('travel-start')}}
        onTabChange={handleTabChange}
      />
    );
  }else if(screen==='stamps'){
    content=(
      <StampsScreen
        unlockedCount={completedCities.length}
        activeTab={activeTab}
        onTabChange={handleTabChange}
      />
    );
  }else if(screen==='diary'){
    content=(
      <DiaryScreen
        completedCities={completedCities}
        activeTab={activeTab}
        onTabChange={handleTabChange}
      />
    );
  }else if(screen==='diary-prompt'){
    content=(
      <DiaryPromptScreen
        city={selCity}
        onView={()=>{setActiveTab('diary');go('diary')}}
        onSkip={()=>{setActiveTab('cover');go('home')}}
      />
    );
  }else{
    content=(
      <div style={{height:'100%',background:CREAM,display:'flex',alignItems:'center',
        justifyContent:'center'}}>
        <KBtn onClick={()=>go('loading')}>Restart</KBtn>
      </div>
    );
  }

  return <Shell overlay={overlay}>{content}</Shell>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
